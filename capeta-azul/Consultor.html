      headline="Resoluções comentadas — direto ao ponto";
      sub="Você quer entender o raciocínio das questões. Começa pelo solucionário e reforça com o banco.";
      itens=[{id:"solucionario",destaque:true,selo:"RECOMENDADO",motivo:"Cada questão do livro resolvida em vídeo, com atalhos de prova."},
        {id:"bancoQuestoes",motivo:"Mais questões para praticar o mesmo tipo de raciocínio."},
        {id:"solucionarioTGE",motivo:"Se a geometria também trava, esse resolve."},
        Object.assign({},curso,{motivo:"Para quando quiser a preparação completa."})];
    } else if(formato==="reta-final"){
      headline="Modo Reta Final ativado";
      sub="Sem tempo a perder: treino intensivo com o banco + resolução rápida em vídeo. Tudo com acesso imediato.";
      mood="reta_final";
      itens=[{id:"bancoQuestoes",destaque:true,selo:"RETA FINAL",motivo:"Simule o dia da prova: volume alto de questões, todo dia."},
        {id:"solucionario",selo:"ACESSO IMEDIATO",motivo:"Destrave em vídeo o que ainda te derruba, sem enrolação."},
        Object.assign({},curso,{motivo:"Se ainda houver fôlego, aprofunde nos pontos fracos."})];
    } else {
      itens=[Object.assign({},curso,{destaque:true,selo:"RECOMENDADO",motivo:"Sua preparação principal, guiada e completa."}),
        {id:"solucionario",motivo:"Para destravar as questões difíceis do livro."},
        {id:"bancoQuestoes",motivo:"Treino diário com +10.000 questões."},
        {id:"livro",motivo:"A base física da preparação."}];
    }

    if(concurso==="epcar") itens.push({id:"cursoEPCAr",motivo:"Alternativa mais enxuta, focada só no EPCAr."});

    if(urgente){
      mood="reta_final";
      if(headline==="Plano recomendado para você"||formato==="videoaulas") headline="Menos de 30 dias — foco total na reta final";
      sub="A menos de 30 dias, o que vale é acesso imediato e volume de questões. Deixei o físico por último de propósito.";
      var prio=["bancoQuestoes","solucionario"];
      itens.sort(function(x,y){var ix=prio.indexOf(x.id),iy=prio.indexOf(y.id);return (ix===-1?99:ix)-(iy===-1?99:iy);});
      if(itens[0]){itens[0].destaque=true;itens[0].selo="RETA FINAL";}
      itens=itens.map(function(it){return (it.id==="solucionario"&&!it.selo)?Object.assign({},it,{selo:"ACESSO IMEDIATO"}):it;});
    } else if(comecando){
      mood="inicio"; gratis=true;
      if(headline==="Plano recomendado para você") headline="Começando agora? Bem-vindo ao jogo";
      sub="Sem pressa e com método: comece pela base, teste de graça e vá subindo os degraus no seu ritmo.";
      var temLivro=itens.some(function(it){return it.id==="livro";});
      if(!temLivro) itens.push({id:"livro",motivo:"A base física para começar do jeito certo."});
    }

    return {headline:headline,sub:sub,mood:mood,whatsapp:whatsapp,gratis:gratis,itens:dedup(itens).slice(0,5)};
  }

  // ---- Estado ----
  var step=0, answers={};
  var app=document.getElementById("app");
  function scrollTop(){window.scrollTo({top:0,behavior:"smooth"});}

  function accent(product,item,mood){
    if(product.id==="whatsapp")return{cls:"cdm-card cdm-whats",btn:"cdm-btn cdm-btn-whats",tag:"cdm-tag-whats",selo:"cdm-selo-whats"};
    if(item&&item.destaque&&mood==="reta_final")return{cls:"cdm-card cdm-hero-red",btn:"cdm-btn cdm-btn-red",tag:"cdm-tag-red",selo:"cdm-selo-red"};
    if(item&&item.destaque)return{cls:"cdm-card cdm-hero-gold",btn:"cdm-btn cdm-btn-gold",tag:"cdm-tag-gold",selo:"cdm-selo-gold"};
    var gold=product.tier==="aprofunda";
    return{cls:"cdm-card",btn:"cdm-btn cdm-btn-blue",tag:gold?"cdm-tag-gold":"cdm-tag-blue",selo:"cdm-selo-blue"};
  }

  function cardHTML(product,item,mood,i){
    var a=accent(product,item,mood), h="";
    h+='<article class="'+a.cls+'" style="animation-delay:'+(i*90)+'ms">';
    if(item&&item.selo) h+='<span class="cdm-selo '+a.selo+'">'+item.selo+'</span>';
    h+='<p class="cdm-tag '+a.tag+'">'+product.tag+'</p>';
    h+='<h3 class="cdm-card-title">'+product.titulo+'</h3>';
    h+='<p class="cdm-card-desc">'+product.descricao+'</p>';
    h+='<p class="cdm-ideal"><span>Ideal para: </span>'+product.idealPara+'</p>';
    if(item&&item.motivo) h+='<div class="cdm-motivo"><span>Por que pra você: </span>'+item.motivo+'</div>';
    h+='<p class="cdm-preco">'+product.preco+'</p>';
    h+='<div class="cdm-ctas">';
    h+='<a class="'+a.btn+'" href="'+product.ctaHref+'" target="_blank" rel="noopener noreferrer" data-cta="'+product.id+'">'+product.ctaLabel+'</a>';
    if(product.saibaMaisHref) h+='<a class="cdm-btn cdm-btn-ghost" href="'+product.saibaMaisHref+'" target="_blank" rel="noopener noreferrer" data-cta="'+product.id+'_saibamais">'+(product.saibaMaisLabel||"Saiba mais")+'</a>';
    h+='</div></article>';
    return h;
  }

  function headerHTML(){
    return '<header class="cdm-header">'
      +'<div class="cdm-insignia">&Sigma;</div>'
      +'<h1 class="cdm-brand">DEUS DA <span>MATEM&Aacute;TICA</span></h1>'
      +'<p class="cdm-sub">Descubra o melhor material para sua aprova&ccedil;&atilde;o</p>'
      +'<div class="cdm-authority"><span>IME</span><i>&middot;</i><span>12 medalhas</span><i>&middot;</i><span>+1000 aprovados</span><i>&middot;</i><span>6 livros</span></div>'
      +'</header>';
  }

  function progressHTML(done){
    var label=done?"Plano pronto":("Pergunta 0"+(step+1)+" / 0"+TOTAL);
    var segs="";
    for(var i=0;i<TOTAL;i++){
      var cls=done?"gold":(i<=step?"blue":"");
      segs+='<div class="cdm-seg"><div class="cdm-seg-fill '+cls+'"></div></div>';
    }
    return '<div class="cdm-progress"><div class="cdm-progress-row">'
      +'<span class="cdm-eyebrow">'+(done?"Dossi&ecirc;":"Consultor")+'</span>'
      +'<span class="cdm-eyebrow">'+label+'</span></div>'
      +'<div class="cdm-segs">'+segs+'</div></div>';
  }

  function render(){
    var done=step>=TOTAL, html=headerHTML()+progressHTML(done);

    if(!done){
      var q=QUESTIONS[step], opts="";
      for(var i=0;i<q.options.length;i++){
        var o=q.options[i], sel=answers[q.id]===o.value;
        opts+='<button class="cdm-opt'+(sel?" sel":"")+'" data-select="'+o.value+'"><span>'+o.label+'</span><i class="cdm-arrow">&rarr;</i></button>';
      }
      html+='<div class="cdm-step"><p class="cdm-eyebrow cdm-cat">'+q.eyebrow+'</p>'
        +'<h2 class="cdm-q-title">'+q.title+'</h2>'
        +'<p class="cdm-q-hint">'+q.hint+'</p>'
        +'<div class="cdm-options">'+opts+'</div>';
      if(step>0) html+='<button class="cdm-back" data-back="1">&larr; Voltar e alterar</button>';
      html+='</div>';
    } else {
      var rec=getRecommendation(answers);
      var moodEyebrow = rec.mood==="reta_final"?"Dossi&ecirc; &middot; Reta Final":rec.mood==="inicio"?"Dossi&ecirc; &middot; Ponto de Partida":rec.mood==="completo"?"Dossi&ecirc; &middot; Plano Completo":"Dossi&ecirc; &middot; Plano de Aprova&ccedil;&atilde;o";
      html+='<div class="cdm-step"><p class="cdm-eyebrow cdm-cat">'+moodEyebrow+'</p>'
        +'<h2 class="cdm-result-title">'+rec.headline+'</h2>'
        +'<p class="cdm-result-sub">'+rec.sub+'</p>';
      var chips="";
      for(var c=0;c<QUESTIONS.length;c++){
        var qq=QUESTIONS[c], val=answers[qq.id];
        if(!val) continue;
        var found=qq.options.filter(function(x){return x.value===val;})[0];
        if(found) chips+='<span class="cdm-chip">'+found.label+'</span>';
      }
      if(chips) html+='<div class="cdm-chips">'+chips+'</div>';
      var cards="";
      for(var k=0;k<rec.itens.length;k++){
        var it=rec.itens[k], p=PRODUCTS[it.id];
        if(p) cards+=cardHTML(p,it,rec.mood,k);
      }
      html+='<div class="cdm-cards">'+cards+'</div>';
      html+='<div class="cdm-trust"><span>&#128737;&#65039; 7 dias de garantia</span><i>&middot;</i><span>&#9889; acesso imediato</span><i>&middot;</i><span>&#9733; 5,0 no ML</span></div>';
      if(rec.gratis){
        html+='<div class="cdm-free"><p class="cdm-eyebrow" style="margin-bottom:10px">Comece de gra&ccedil;a hoje</p>'
          +'<a class="cdm-btn cdm-btn-ghost" href="'+LINKS.aulaGratis+'" target="_blank" rel="noopener noreferrer" data-cta="gratis_aula">&#127909; Assistir aula gr&aacute;tis no YouTube</a>'
          +'<a class="cdm-btn cdm-btn-ghost" style="margin-top:8px" href="'+LINKS.listasGratis+'" target="_blank" rel="noopener noreferrer" data-cta="gratis_listas">&#128218; Baixar listas de exerc&iacute;cios gr&aacute;tis</a></div>';
      }
      if(rec.whatsapp){
        html+='<div style="margin-top:16px">'+cardHTML(PRODUCTS.whatsapp,{selo:"TIRE SUA D&Uacute;VIDA"},rec.mood,0)+'</div>';
      }
      html+='<button class="cdm-redo" data-restart="1">&#8635; Refazer o consultor</button>';
      html+='<p class="cdm-eyebrow cdm-foot">Deus da Matem&aacute;tica &middot; Bruno Pedra &copy; 2026</p>';
      html+='</div>';
    }
    app.innerHTML=html;
  }

  // ---- Eventos (delegação) ----
  app.addEventListener("click", function(e){
    var opt=e.target.closest("[data-select]");
    if(opt){
      var q=QUESTIONS[step], value=opt.getAttribute("data-select");
      answers[q.id]=value;
      track("resposta",{pergunta:q.id,valor:value});
      render();
      setTimeout(function(){
        step++; render(); scrollTop();
        if(step>=TOTAL) track("plano_gerado",Object.assign({},answers));
      },220);
      return;
    }
    if(e.target.closest("[data-back]")){ step=Math.max(0,step-1); render(); scrollTop(); return; }
    if(e.target.closest("[data-restart]")){ track("refazer_consultor"); answers={}; step=0; render(); scrollTop(); return; }
    var cta=e.target.closest("a[data-cta]");
    if(cta){ track("clique_produto",{alvo:cta.getAttribute("data-cta"),href:cta.getAttribute("href")}); }
  });

  track("inicio_consultor");
  render();
})();
</script>
</body>
</html>
